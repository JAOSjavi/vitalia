[project]
name = "vitalia"
version = "0.1.0"
description = "Servidor de Vitalia"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
# conftest es el módulo de apoyo de las pruebas.
known-first-party = ["vitalia", "conftest"]

[tool.mypy]
strict = true
files = ["vitalia", "pruebas", "migraciones"]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["bd: necesita un PostgreSQL de verdad"]

# Regla de dependencia de la arquitectura limpia (diseno/01-arquitectura.md, sección 7.1).
[tool.importlinter]
root_package = "vitalia"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Las dependencias apuntan hacia el dominio"
type = "layers"
layers = [
    "vitalia.principal",
    "vitalia.entrada | vitalia.adaptadores",
    "vitalia.casos_de_uso",
    "vitalia.dominio",
]

[[tool.importlinter.contracts]]
name = "El dominio y los casos de uso no conocen la tecnología"
type = "forbidden"
source_modules = ["vitalia.dominio", "vitalia.casos_de_uso"]
forbidden_modules = [
    "vitalia.configuracion",
    "fastapi",
    "starlette",
    "pydantic",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "dotenv",
    "argon2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
