<title>Prototipo Vitalia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Zilla+Slab:wght@500;600;700&display=swap">
<style>
/* Disposición: barra con cambio de rol; el paciente vive en una columna de celular y el médico en un panel con menú lateral. */
:root{
  --papel:#f2f5fa; --superficie:#ffffff; --hundido:#e6ecf5; --tinta:#14213a; --tinta-suave:#4a5872; --linea:#ccd6e5;
  --acento:#1f47b8; --acento-suave:#e1e9fc; --sobre-acento:#ffffff;
  --ok:#136c45; --ok-suave:#d8f1e4; --aviso:#7a5000; --aviso-suave:#fbecc6; --alerta:#a8211a; --alerta-suave:#fbdfdc;
  --hoja-doc:#ffffff; --tinta-doc:#1c2333; --resalte:#ffe27a; --velo:rgba(20,33,58,.55);
  --f-titulo:"Zilla Slab",Rockwell,Georgia,serif;
  --f-texto:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  --f-dato:"Atkinson Hyperlegible Mono",ui-monospace,Consolas,monospace;
  --radio:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --papel:#0e1420; --superficie:#161e2e; --hundido:#1f293c; --tinta:#e7ecf6; --tinta-suave:#a2afc6; --linea:#2d394f;
  --acento:#93b2ff; --acento-suave:#1c2a4a; --sobre-acento:#0e1420;
  --ok:#74d6a7; --ok-suave:#133125; --aviso:#f1c466; --aviso-suave:#392d10; --alerta:#ff9f96; --alerta-suave:#3c1a17; --velo:rgba(0,0,0,.62);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --papel:#0e1420; --superficie:#161e2e; --hundido:#1f293c; --tinta:#e7ecf6; --tinta-suave:#a2afc6; --linea:#2d394f;
  --acento:#93b2ff; --acento-suave:#1c2a4a; --sobre-acento:#0e1420;
  --ok:#74d6a7; --ok-suave:#133125; --aviso:#f1c466; --aviso-suave:#392d10; --alerta:#ff9f96; --alerta-suave:#3c1a17; --velo:rgba(0,0,0,.62);
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--papel);color:var(--tinta);font-family:var(--f-texto);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--f-titulo);font-weight:600;line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:1.6rem} h2{font-size:1.2rem} h3{font-size:1.02rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{max-width:1160px;margin-inline:auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
.barra{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:2px solid var(--tinta)}
.marca{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-family:var(--f-titulo);font-size:1.5rem;font-weight:700}
.marca small{font-family:var(--f-texto);font-size:.82rem;font-weight:400;color:var(--tinta-suave)}
.ver-como{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--tinta-suave)}
.segmento{display:inline-flex;border:1px solid var(--tinta);border-radius:var(--radio);overflow:hidden}
.segmento button{border:0;background:transparent;padding:8px 16px;cursor:pointer;min-height:44px;font-weight:600;color:var(--tinta)}
.segmento button[aria-pressed="true"]{background:var(--tinta);color:var(--papel)}

.pila{display:flex;flex-direction:column;gap:14px}
.suave{color:var(--tinta-suave)} .chica{font-size:.88rem}
.dato{font-family:var(--f-dato);font-variant-numeric:tabular-nums}
.hoja{background:var(--superficie);border:1px solid var(--linea);border-radius:var(--radio);padding:16px;min-width:0}
.encabezado{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px}
.botones{display:flex;flex-wrap:wrap;gap:8px}
.boton{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 16px;border-radius:var(--radio);border:1px solid var(--linea);background:var(--superficie);cursor:pointer;font-weight:600;text-align:center}
.boton.primario{background:var(--acento);border-color:var(--acento);color:var(--sobre-acento)}
.boton.peligro{color:var(--alerta);border-color:var(--alerta)}
.boton.chico{min-height:36px;padding:4px 12px;font-size:.9rem}
.boton:disabled{opacity:.5;cursor:not-allowed}
.enlace{background:none;border:0;padding:0;color:var(--acento);text-decoration:underline;cursor:pointer;font-weight:600;text-align:left}
.fila-enlaces{display:flex;flex-wrap:wrap;gap:8px 20px}
.pildora{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap;background:var(--hundido);color:var(--tinta-suave)}
.pildora.p-ok{background:var(--ok-suave);color:var(--ok)}
.pildora.p-aviso{background:var(--aviso-suave);color:var(--aviso)}
.pildora.p-alerta{background:var(--alerta-suave);color:var(--alerta)}
.pildora.p-acento{background:var(--acento-suave);color:var(--acento)}
.nota{padding:12px 14px;border-radius:var(--radio);background:var(--hundido);font-size:.95rem}
.nota.n-ok{background:var(--ok-suave);color:var(--ok)}
.nota.n-aviso{background:var(--aviso-suave);color:var(--aviso)}
.nota.n-alerta{background:var(--alerta-suave);color:var(--alerta)}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo label{font-weight:600;font-size:.9rem}
input,select,textarea{min-height:44px;padding:8px 10px;border:1px solid var(--linea);border-radius:var(--radio);background:var(--superficie);max-width:100%}
input[type="checkbox"]{min-height:0;width:22px;height:22px;flex:none}
.marcar{display:flex;gap:10px;align-items:flex-start}
.rejilla2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.lista-def{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;margin:0}
.lista-def dt{color:var(--tinta-suave);font-size:.9rem} .lista-def dd{margin:0}

/* Paciente */
.movil{max-width:440px;width:100%;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.pestanas{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--linea);border-radius:var(--radio);overflow:hidden;background:var(--superficie)}
.pestanas button{border:0;background:transparent;padding:10px 2px;min-height:48px;cursor:pointer;font-weight:600;font-size:.82rem;color:var(--tinta-suave);min-width:0;overflow-wrap:anywhere}
.pestanas button[aria-current="true"]{background:var(--acento-suave);color:var(--acento)}
.boleta{background:var(--acento);color:var(--sobre-acento);border-radius:var(--radio);padding:16px;display:flex;flex-direction:column;gap:8px}
.boleta .rotulo{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.boleta .cuando{font-family:var(--f-titulo);font-size:1.35rem;font-weight:600;line-height:1.2}
.boleta .boton{background:transparent;color:inherit;border-color:currentColor}
.accesos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opcion{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 14px;border:1px solid var(--linea);border-radius:var(--radio);background:var(--superficie);cursor:pointer;text-align:left;font-weight:600}
.opcion span{font-weight:400;color:var(--tinta-suave);font-size:.9rem;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 12px;border:1px solid var(--linea);border-radius:999px;background:var(--superficie);cursor:pointer;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.espacios{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.espacio{min-height:44px;border:1px solid var(--linea);border-radius:var(--radio);background:var(--superficie);cursor:pointer;font-family:var(--f-dato);font-size:.88rem}
.espacio:disabled{text-decoration:line-through;opacity:.45;cursor:not-allowed}
.espacio[aria-pressed="true"]{background:var(--acento);border-color:var(--acento);color:var(--sobre-acento)}
.pasos{display:flex;gap:6px}
.pasos i{flex:1;height:4px;border-radius:2px;background:var(--linea)}
.pasos i.hecho{background:var(--acento)}
.elemento{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--linea)}
.elemento:first-child{border-top:0;padding-top:0}
.elemento b{display:block}
.elemento .abajo{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}

/* Médico */
.panel{display:grid;grid-template-columns:196px minmax(0,1fr);gap:24px;align-items:start}
.menu{display:flex;flex-direction:column;gap:4px}
.menu button{text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:var(--radio);cursor:pointer;min-height:44px;color:var(--tinta-suave);font-weight:600}
.menu button[aria-current="true"]{background:var(--acento-suave);color:var(--acento)}
.menu .quien{margin-top:12px;padding:12px;border-top:1px solid var(--linea);font-size:.88rem;color:var(--tinta-suave)}
.contenido{display:flex;flex-direction:column;gap:16px;min-width:0}
.fila{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--linea)}
.fila:first-child{border-top:0}
.fila .h{font-family:var(--f-dato);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.fila .quien{min-width:0}
.fila .quien span{display:block;color:var(--tinta-suave);font-size:.9rem}
.fila .acc{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.fila .ancho{grid-column:1/-1}
.dos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.desliza{overflow-x:auto}
.semana{display:grid;grid-template-columns:94px repeat(5,minmax(128px,1fr));min-width:734px;border:1px solid var(--linea);border-radius:var(--radio);background:var(--superficie)}
.semana .cab{padding:8px;font-weight:700;border-bottom:1px solid var(--linea);text-align:center;font-size:.92rem}
.semana .cab.hoy{color:var(--acento)}
.semana .hh{padding:8px 6px;font-family:var(--f-dato);font-size:.74rem;color:var(--tinta-suave);border-top:1px solid var(--linea);white-space:nowrap}
.celda{border-top:1px solid var(--linea);border-left:1px solid var(--linea);min-height:44px;padding:3px;display:flex;flex-direction:column;gap:3px;font-size:.8rem}
.celda.fuera{background:var(--hundido)}
.celda.bloq{background:repeating-linear-gradient(135deg,var(--hundido) 0 6px,transparent 6px 12px);color:var(--tinta-suave);justify-content:center;text-align:center}
.celda .libre{flex:1;border:0;background:transparent;cursor:pointer;color:var(--tinta-suave);min-height:36px;border-radius:4px}
.celda .libre:hover{background:var(--acento-suave);color:var(--acento)}
.celda .libre[aria-pressed="true"]{background:var(--acento);color:var(--sobre-acento)}
.ficha-c{border:0;background:var(--acento-suave);color:var(--tinta);padding:3px 6px;border-radius:4px;text-align:left;cursor:pointer;font-size:.8rem;line-height:1.3}
.ficha-c.hecha{background:var(--ok-suave)}
.mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--linea);border-radius:var(--radio);overflow:hidden;background:var(--superficie)}
.mes > *{min-height:66px;padding:6px;border:0;border-top:1px solid var(--linea);border-left:1px solid var(--linea);border-radius:0;font-size:.8rem;min-width:0;overflow-wrap:anywhere;text-align:left;background:transparent;color:inherit}
.mes .cab{min-height:0;font-weight:700;text-align:center;border-top:0}
.mes .n{font-family:var(--f-dato);font-weight:600;display:block}
.mes .es-hoy .n{color:var(--acento)}
.mes .vacio{background:var(--hundido)}
.mes button.dia{cursor:pointer;display:block;width:100%}
.mes button.dia:hover{background:var(--acento-suave)}
.med{padding:12px 0 0;border-top:1px solid var(--linea);display:flex;flex-direction:column;gap:4px}
.como{background:var(--acento-suave);padding:8px 10px;border-radius:var(--radio)}
.como b,.elemento .como b{display:inline}
.elemento .detalle{flex-direction:column;flex-wrap:nowrap;gap:12px}
.lista-simple{margin:0;padding-left:18px}
.grupo{border:1px solid var(--linea);border-radius:var(--radio);padding:12px;margin:0;min-width:0;display:flex;flex-direction:column;gap:12px}
.velo{position:fixed;inset:0;z-index:10;background:var(--velo);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.modal{background:var(--superficie);color:var(--tinta);border:1px solid var(--linea);border-radius:var(--radio);max-width:540px;width:100%;max-height:100%;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.puntos{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.puntos .clave{border:2px solid var(--acento);background:var(--acento-suave);border-radius:var(--radio);padding:10px 12px}
.chat{display:flex;flex-direction:column;gap:10px}
.burbuja{padding:10px 12px;border-radius:var(--radio);overflow-wrap:anywhere}
.burbuja.pregunta{align-self:flex-end;background:var(--acento-suave);max-width:90%}
.burbuja.respuesta{background:var(--hundido)}
.origen{display:inline-block;font-family:var(--f-dato);font-size:.76rem;padding:1px 6px;border:1px solid var(--acento);color:var(--acento);border-radius:4px;background:transparent;cursor:pointer;margin-left:4px}
.pregunta-linea{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.resumen h3{margin-top:10px}
.resumen ul{margin:4px 0 0;padding-left:18px}
.visor-barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.pagina{background:var(--hoja-doc);color:var(--tinta-doc);border:1px solid var(--linea);padding:28px 24px;border-radius:2px;max-width:640px;width:100%;margin-inline:auto;min-height:380px;display:flex;flex-direction:column;gap:12px;font-size:calc(.95rem * var(--zoom,1));overflow-wrap:anywhere}
.pagina mark{background:var(--resalte);color:inherit;padding:0 2px}
.pagina .membrete{font-family:var(--f-titulo);font-weight:700;border-bottom:1px solid var(--tinta-doc);padding-bottom:8px}
.tabla{width:100%;border-collapse:collapse;min-width:580px;font-size:.92rem}
.tabla th,.tabla td{text-align:left;padding:8px 10px;border-top:1px solid var(--linea);vertical-align:top}
.tabla th{border-top:0;color:var(--tinta-suave);font-size:.82rem;letter-spacing:.04em;text-transform:uppercase}
.pie{font-size:.85rem;color:var(--tinta-suave);border-top:1px solid var(--linea);padding-top:12px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.hu{font-family:var(--f-dato);font-size:.76rem;padding:1px 6px;border:1px solid var(--linea);border-radius:4px}

@media (max-width:900px){.dos{grid-template-columns:1fr}}
@media (max-width:820px){
  .panel{grid-template-columns:1fr;gap:12px}
  .menu{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .menu button{white-space:nowrap}
  .menu .quien{display:none}
}
@media (max-width:560px){
  .fila{grid-template-columns:102px minmax(0,1fr)}
  .fila .h{font-size:.88rem}
  .fila .acc{grid-column:1/-1;justify-content:flex-start}
  .accesos{grid-template-columns:1fr}
}
</style>

<div class="app">
  <header class="barra">
    <div class="marca">Vitalia <small>Prototipo navegable · datos de ejemplo</small></div>

        <button id="rol-medico" data-a="rol" data-r="medico" aria-pressed="true">Médico</button>
      </div>
    </div>
  </header>
  <main id="lienzo"></main>
  <footer class="pie" id="pie"></footer>
</div>

  if (ev.target.id === 'buscar-pac') { E.busca = ev.target.value; var r = document.getElementById('res-pac'); if (r) r.innerHTML = listaPacientes(); }

  if (ev.key === 'Escape' && E.rol === 'paciente' && !E.sesionP && E.vp === 'registro' && E.reg.paso === 3) { E.reg.paso = 2; E.reg.error = null; pintar(); }
  if (ev.key === 'Enter' && ev.target.id === 'pregunta') { var q = ev.target.value.trim(); if (q) { preguntar(q); pintar(); } }
});
